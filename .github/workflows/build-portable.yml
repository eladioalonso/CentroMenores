name: Build portable Windows

on:
  workflow_dispatch:
  push:
    branches:
      - desarrollo/**

permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and packager
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests before packaging
        run: python -m pytest
      - name: Build onedir portable application
        run: pyinstaller --clean --noconfirm GestionCentro.spec
      - name: Verify packaged resources
        shell: pwsh
        run: |
          if (!(Test-Path "dist/GestionCentro/GestionCentro.exe")) { throw "Executable missing" }
          if (!(Test-Path "dist/GestionCentro/_internal/alembic.ini")) { throw "Alembic config missing" }
          if (!(Test-Path "dist/GestionCentro/_internal/migrations/versions/0001_auth_core.py")) { throw "Migration missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: GestionCentro-Windows-portable
          path: dist/GestionCentro/
          if-no-files-found: error
          retention-days: 14
